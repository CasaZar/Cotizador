<!--
  Bandeja de mensajes (18-11-2026) · ETAPA 2: LEER, EDITAR Y ENVIAR CON APROBACIÓN.
  Muestra los chats que llegan al WhatsApp de la bandeja (+56 9 9305 1122) por la API oficial
  de Meta y el borrador que deja Claude para cada uno. Una persona lo revisa, lo edita si quiere
  y aprieta Enviar (con confirmación). Nada sale automático.
  Datos: tablas mensajes_chats / mensajes / mensajes_borradores del proyecto Cotizador
  (migraciones 0004 y 0006 y función mensajes-webhook, en el repo de Gestión: supabase-cotizador/).
  Esta página NO escribe en la base: Enviar y «Tomar este chat» llaman a la función
  (rutas /enviar y /tomar) con la sesión del usuario, y es la base la que acepta o rechaza
  (ventana de 24 horas, tope de 2 sin respuesta, chat tomado, texto). Quién ve qué lo decide RLS.
  Probar en el PC: localhost + ?local lee mensajes-local.json (datos de mentira; el envío se simula).
  AVISOS (25-11-2026, migración 0014): la campana activa las notificaciones de ESTE dispositivo
  (mensajes-sw.js + ruta /push de la función). Con la página abierta, además, suena y muestra una
  franja cuando un cliente escribe: cada 15 segundos pregunta solo si llegó algo (una consulta
  mínima) y recién entonces recarga todo.
-->

/* ── Formato ─────────────────────────────────────────────────────────── */
function dos(n){ return (n < 10 ? '0' : '') + n; }
function hora(d){ return dos(d.getHours()) + ':' + dos(d.getMinutes()); }
function diaCorto(d){ return dos(d.getDate()) + '-' + dos(d.getMonth() + 1); }
function mismoDia(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function cuando(iso){
  if (!iso) return '';
  var d = new Date(iso); if (isNaN(d.getTime())) return '';
  return mismoDia(d, new Date()) ? hora(d) : diaCorto(d) + ' ' + hora(d);
}
function corta(s, n){ s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function telBonito(t){
  var d = String(t == null ? '' : t).replace(/\D/g, '');
  if (!d) return '';
  if (d.length === 11 && d.indexOf('569') === 0) return '+56 9 ' + d.slice(3, 7) + ' ' + d.slice(7);
  return '+' + d;

function nombre(c){ return c.nombre || telBonito(c.telefono) || (c.canal === 'instagram' ? 'Cliente de Instagram' : 'Cliente'); }
function iniciales(c){
  var n = String(c.nombre || '').trim();
  if (n) { var p = n.split(/\s+/); return (p[0].charAt(0) + (p[1] ? p[1].charAt(0) : '')).toUpperCase(); }

}
function anuncio(c){ var o = c.origen || {}; return o.headline || o.ad_title || ''; }

function textoMsg(m){ return m.texto || (m.tipo && m.tipo !== 'text' ? '[' + (TIPOS[m.tipo] || m.tipo) + ']' : '[mensaje sin texto]'); }
function ventana(c){
  if (!c.ultimo_entrante_at) return { abierta: false, texto: 'El cliente todavía no escribe.' };
  var ms = new Date(c.ultimo_entrante_at).getTime() + 24 * 3600000 - Date.now();

function falta(ms){ var m = Math.max(0, Math.floor(ms / 60000)); return m >= 60 ? Math.floor(m / 60) + ' h' : m + ' min'; }

function fila(c){
  var u = ULT[c.id], b = BORR[c.id], rev = (b && b.revision) || {};
  var chips = '<span class="chip ' + (c.canal === 'instagram' ? 'ig' : 'wa') + '">' + (c.canal === 'instagram' ? 'Instagram' : 'WhatsApp') + '</span>';

  if (rev.falta_precio) chips += '<span class="chip a">Falta un precio</span>';

function chk(ok, si, no){ return '<li' + (ok ? '' : ' class="no"') + '>' + (ok ? ICO.si : ICO.no) + '<span>' + esc(ok ? si : no) + '</span></li>'; }
/* Quién lleva el chat y qué puedo hacer yo (la función y la base lo vuelven a comprobar). */

function motivoNoEnviar(c){

function redaccionHtml(c, b){

/* ── Datos (solo lectura) ────────────────────────────────────────────── */
async function cargarDatos(){
  var chats, msgs, borrs;
  if (LOCAL) {
    /* El archivo se lee una sola vez: después los datos de mentira viven en memoria, para poder simular envíos. */
    if (!LOCAL_DATOS) {
      var j = await (await fetch('mensajes-local.json', { cache: 'no-store' })).json();
      var isoHace = function(min){ return new Date(Date.now() - min * 60000).toISOString(); };
      j.chats.forEach(function(c){ c.ultimo_entrante_at = c._hace_min == null ? null : isoHace(c._hace_min); });
      j.mensajes.forEach(function(m){ m.enviado_at = isoHace(m._hace_min); });
      LOCAL_DATOS = j;
    }
    chats = LOCAL_DATOS.chats.filter(function(c){ return c.estado !== 'cerrado'; });
    msgs = []; LOCAL_MSGS = {};
    LOCAL_DATOS.mensajes.forEach(function(m){ (LOCAL_MSGS[m.chat_id] = LOCAL_MSGS[m.chat_id] || []).push(m); msgs.push(m); });
    msgs.sort(function(a, b){ return a.enviado_at < b.enviado_at ? 1 : -1; });
    borrs = LOCAL_DATOS.borradores;
    NUM = LOCAL_DATOS.resumen || null;
  } else {
    var r = await Promise.all([
      sb.from('mensajes_chats').select('id,canal,nombre,telefono,estado,tomado_por,origen,ultimo_entrante_at,toques_sin_respuesta')
        .is('deleted_at', null).neq('estado', 'cerrado').order('ultimo_entrante_at', { ascending: false, nullsFirst: false }).limit(300),
      sb.from('mensajes').select('chat_id,autor,tipo,texto,enviado_at').order('enviado_at', { ascending: false }).limit(800),
      sb.from('mensajes_borradores').select('id,chat_id,texto,revision,para,created_at').eq('estado', 'pendiente').order('created_at', { ascending: false }).limit(300)
    ]);
    if (r[0].error || r[1].error || r[2].error) throw new Error('consulta');
    chats = r[0].data || []; msgs = r[1].data || []; borrs = r[2].data || [];
    /* los números del asistente: si la consulta falla, la bandeja sigue igual, sin ese cuadro */
    try { var rn = await sb.rpc('asistente_resumen', { p_dias: 30 }); NUM = rn.error ? null : rn.data; } catch (e) { NUM = null; }
  }
  CHATS = chats; ULT = {}; BORR = {};
  msgs.forEach(function(m){ if (!ULT[m.chat_id]) ULT[m.chat_id] = m; });       /* vienen del más nuevo al más viejo */
  borrs.forEach(function(b){ if (!BORR[b.chat_id]) BORR[b.chat_id] = b; });
  notarLlegadas();
}
async function cargarMsgs(id){
  if (LOCAL) { MSGS = (LOCAL_MSGS[id] || []).slice().sort(function(a, b){ return a.enviado_at < b.enviado_at ? -1 : 1; }); return; }
  var r = await sb.from('mensajes').select('id,autor,tipo,texto,enviado_at,enviado_por').eq('chat_id', Number(id)).order('enviado_at', { ascending: true }).limit(400);
  if (r.error) throw new Error('mensajes');
  MSGS = r.data || [];
}
/* El tramo de 10 minutos hace que los «Quedan X h» de la lista se repinten aunque no llegue nada. */
function firma(){ return JSON.stringify([CHATS, BORR, ABIERTO, MSGS.length, NUM, NUEVOS, Math.floor(Date.now() / 600000)]); }
async function recargar(silencio){
  try {
    await cargarDatos();
    if (ABIERTO) await cargarMsgs(ABIERTO);
    var f = firma();
    if (!silencio || f !== FIRMA) render();      /* al refrescar solo, no se repinta si nada cambió */
    FIRMA = f;
    if (!silencio) toast('Actualizado.');
  } catch (e) { if (!silencio) toast('No se pudo actualizar. Revisa la conexión.'); }
}
async function abrir(id){
  ABIERTO = Number(id); MSGS = []; delete NUEVOS[ABIERTO]; pintarFranja(); render(); window.scrollTo(0, 0);
  try { await cargarMsgs(ABIERTO); } catch (e) { toast('No se pudieron cargar los mensajes.'); }
  FIRMA = firma(); render();
}
async function copiar(){
  var c = chatPorId(ABIERTO); if (!c) return;
  var t = String(textoActual(c, BORR[c.id]) || '');
  if (!t.trim()) { toast('No hay texto para copiar.'); return; }
  try { await navigator.clipboard.writeText(t); toast('Texto copiado.'); }
  catch (e) {
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Texto copiado.'); } catch (e2) { toast('No se pudo copiar.'); }
    document.body.removeChild(ta);
  }
}

/* ── Enviar y tomar: van por la función, con la sesión del usuario ────── */
function nuevaClave(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}
async function llamar(ruta, cuerpo){
  var s = await sb.auth.getSession();
  var tok = s && s.data && s.data.session && s.data.session.access_token;
  if (!tok) return { status: 401, j: { error: 'Tu sesión venció. Recarga la página y vuelve a entrar.' } };
  var r = await fetch(SB_URL + '/functions/v1/mensajes-webhook/' + ruta, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok, 'apikey': SB_KEY },
    body: JSON.stringify(cuerpo)
  });
  var j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  return { status: r.status, j: j || {} };
}
async function pedirEnvio(){
  var c = chatPorId(ABIERTO); if (!c || OCUPADO) return;
  var no = motivoNoEnviar(c);
  if (no) { toast(no, 5000); return; }
  var texto = String(textoActual(c, BORR[c.id]) || '').trim();
  if (!texto) { toast('Escribe el mensaje antes de enviar.'); return; }
  if (texto.indexOf('[PRECIO') !== -1) { toast('Falta completar un precio: busca [PRECIO: …] en el texto.', 5000); return; }
  /* Antes de confirmar se vuelve a leer el chat. La pantalla se refresca cada minuto, así que el cliente
     pudo escribir algo que todavía no se ve: en ese caso primero se muestra, y recién después se envía. */
  var antes = MSGS.length;
  OCUPADO = true;
  try { await cargarDatos(); await cargarMsgs(ABIERTO); }
  catch (e) { OCUPADO = false; toast('No se pudo revisar el chat. Mira la conexión y vuelve a intentar.', 5000); return; }
  OCUPADO = false; FIRMA = firma();
  c = chatPorId(ABIERTO);
  if (!c) { ABIERTO = null; render(); return; }
  if (MSGS.length !== antes) { render(); toast('Llegó un mensaje nuevo en este chat. Léelo antes de enviar.', 6000); return; }
  no = motivoNoEnviar(c);
  if (no) { render(); toast(no, 5000); return; }
  CONFIRMA = 'enviar'; render();
}
async function enviarConfirmado(){
  var c = chatPorId(ABIERTO); if (!c || OCUPADO) return;
  var b = BORR[c.id];
  var texto = String(textoActual(c, b) || '').trim();
  if (!texto) { CONFIRMA = null; render(); toast('El mensaje está vacío.'); return; }
  /* La misma clave mientras el texto no cambie: si la red falla y se reintenta, el mensaje no sale dos veces. */
  var k = CLAVE[c.id];
  if (!k || k.texto !== texto) k = CLAVE[c.id] = { texto: texto, clave: nuevaClave() };
  OCUPADO = true; render();
  var res = null;
  try {
    if (LOCAL) {
      await new Promise(function(r){ setTimeout(r, 700); });
      LOCAL_DATOS.mensajes.push({ id: Date.now(), chat_id: c.id, autor: 'bandeja', tipo: 'text', texto: texto, enviado_por: 'modo local', enviado_at: new Date().toISOString() });
      LOCAL_DATOS.borradores = LOCAL_DATOS.borradores.filter(function(x){ return x.chat_id !== c.id; });
      c.toques_sin_respuesta = (Number(c.toques_sin_respuesta) || 0) + 1;
      if (!c.tomado_por) c.estado = 'esperando';
      res = { status: 200, j: { ok: true } };
    } else {
      res = await llamar('enviar', { chat_id: Number(c.id), texto: texto, clave: k.clave, borrador_id: b ? Number(b.id) : null });
    }
  } catch (e) { res = null; }
  OCUPADO = false; CONFIRMA = null;
  if (!res) { render(); toast('No hubo respuesta. Toca Actualizar y mira si el mensaje salió antes de reintentar.', 6000); return; }
  if (res.j && res.j.ok) {
    delete CLAVE[c.id]; delete EDIT[c.id];
    await recargar(true); render();
    toast(res.j.aviso || (LOCAL ? 'Simulado: en modo local no se envía nada.' : 'Enviado.'), res.j.aviso ? 6000 : 2600);
    return;
  }
  if (res.j && res.j.definitivo) delete CLAVE[c.id];
  render(); toast((res.j && res.j.error) || 'No se pudo enviar.', 6000);
}
async function tomarConfirmado(){
  var c = chatPorId(ABIERTO); if (!c || OCUPADO) return;
  OCUPADO = true; render();
  var res = null;
  try {
    if (LOCAL) {
      await new Promise(function(r){ setTimeout(r, 400); });
      c.estado = 'de_cesar'; c.tomado_por = MI_MAIL || 'tu@prueba.cl';
      LOCAL_DATOS.borradores.forEach(function(x){ if (x.chat_id === c.id) x.para = 'cesar'; });
      res = { status: 200, j: { ok: true } };
    } else {
      res = await llamar('tomar', { chat_id: Number(c.id) });
    }
  } catch (e) { res = null; }
  OCUPADO = false; CONFIRMA = null;
  if (res && res.j && res.j.ok) { await recargar(true); render(); toast('El chat quedó a tu nombre.'); return; }
  await recargar(true); render();
  toast((res && res.j && res.j.error) || 'No se pudo tomar el chat. Revisa la conexión.', 5000);
}

/* Un solo listener para todo (los botones se repintan). */
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || !LISTO) return;
  if (b.id === 'camp') { AV.abierto = !AV.abierto; AV.nota = ''; pintarAvisos(); return; }
  if (b.dataset.sw) { cambiarAviso(b.dataset.sw); return; }
  if (b.hasAttribute('data-prueba')) { avisoDePrueba(); return; }
  if (b.dataset.tab) { TAB = b.dataset.tab; render(); return; }
  if (b.dataset.chat) { CONFIRMA = null; abrir(b.dataset.chat); return; }
  if (b.hasAttribute('data-atras')) { if (OCUPADO) return; ABIERTO = null; MSGS = []; CONFIRMA = null; FIRMA = firma(); render(); window.scrollTo(0, 0); return; }
  if (b.hasAttribute('data-copiar')) { copiar(); return; }
  if (b.hasAttribute('data-enviar')) { pedirEnvio(); return; }

  if (b.hasAttribute('data-restaurar')) { if (ABIERTO) { delete EDIT[ABIERTO]; delete CLAVE[ABIERTO]; render(); } return; }

});
/* Lo que se escribe queda guardado por chat: un repintado no lo pierde. */
document.addEventListener('input', function(e){ if (e.target && e.target.id === 'txt' && ABIERTO) EDIT[ABIERTO] = e.target.value; });
function escribiendo(){ return !!(document.activeElement && document.activeElement.id === 'txt'); }

async function cargar(){
  if (!LOCAL) {
    var r = await sb.auth.getSession();
    var sess = r && r.data && r.data.session;
    if (!sess) { formLogin(); return; }
    $('#salir').hidden = false;
    MI_MAIL = ((sess.user && sess.user.email) || '').toLowerCase();
    /* Solo para mostrar un aviso claro: lo que protege es RLS (0004). */
    var p = await sb.rpc('mensajes_puede_leer');
    if (p.error || p.data !== true) { bloquear('Tu cuenta no tiene acceso a Mensajes', 'Si lo necesitas, pídeselo a Casa Zaru.'); return; }
    /* Nombres para mostrar quién lleva cada chat (si no se pueden leer, se muestra el correo recortado). */
    var v = await sb.from('vendedores').select('email,nombre');
    (v.data || []).forEach(function(x){ if (x.email && x.nombre) VEND[String(x.email).toLowerCase()] = x.nombre; });
  }
  if (LOCAL) MI_MAIL = 'tu@prueba.cl';
  await cargarDatos();
  LISTO = true; FIRMA = firma();
  $('#act').hidden = false;
  render();
  $('#camp').hidden = false;
  iniciarAvisos();
  /* Si se llegó tocando una notificación (?chat=N), abre ese chat y limpia la dirección. */
  var q = /[?&]chat=(\d+)/.exec(location.search);
  if (q) { try { history.replaceState(null, '', AQUI + (LOCAL ? '?local' : '')); } catch (e) {} if (chatPorId(q[1])) abrir(q[1]); }
  /* Cada 15 segundos pregunta solo si llegó algo (una fila, una columna); si llegó, recarga todo.
     Sin novedad, la recarga completa sigue siendo cada minuto y solo con la página a la vista.
     Mientras alguien escribe o confirma no se repinta el chat: solo aparece la franja y suena. */
  var tic = 0;
  setInterval(async function(){
    if (OCUPADO) return;
    tic++;
    var llego = false;
    try { llego = await hayNovedad(); } catch (e) { llego = false; }
    if (OCUPADO) return;
    var quieto = !!CONFIRMA || escribiendo();
    if (llego && quieto) { try { await cargarDatos(); } catch (e) {} return; }
    if (llego || (tic % 4 === 0 && !document.hidden && !quieto)) { recargar(true); return; }
    pintarFranja();
  }, 15000);
}

/* ── Avisos: franja y sonido con la página abierta, notificaciones con la página cerrada ── */
var NUEVOS = {}, ENTR = null, MARCA = null, AUDIO = null, SWREG = null;
var SONIDO = (function(){ try { return localStorage.getItem('cz_mensajes_sonido') !== 'no'; } catch (e) { return true; } })();
var AV = { abierto: false, soporta: false, permiso: 'default', activo: false, recordatorios: true, fuera: false, ocupado: false, nota: '' };

/* Compara lo recién cargado con lo anterior: un chat cuyo último mensaje del cliente es más nuevo
   que el que se conocía es una llegada. La primera carga no cuenta (no hay con qué comparar). */
function notarLlegadas(){
  var antes = ENTR, suena = false;
  ENTR = {};
  CHATS.forEach(function(c){
    var t = c.ultimo_entrante_at ? new Date(c.ultimo_entrante_at).getTime() : 0;
    ENTR[c.id] = t;
    var u = ULT[c.id];
    if (antes && t && t > (antes[c.id] || 0) && u && u.autor === 'cliente') {
      suena = true;
      if (!(Number(c.id) === Number(ABIERTO) && !document.hidden)) NUEVOS[c.id] = Date.now();
    }
  });
  /* lo que ya se respondió o ya no está en la lista deja de marcarse */
  Object.keys(NUEVOS).forEach(function(id){
    var c = chatPorId(id), u = ULT[id];

}
function pintarFranja(){

  if (!ids.length) { if (!f.hidden) { f.hidden = true; f.innerHTML = ''; } return; }
  ids.sort(function(a, b){ return NUEVOS[b] - NUEVOS[a]; });
  var c = chatPorId(ids[0]);
  var min = Math.floor((Date.now() - NUEVOS[ids[0]]) / 60000);
  var titulo = ids.length > 1 ? ids.length + ' clientes escribieron' : nombre(c) + ' escribió';
  f.innerHTML = ICO.globo + '<div><b>' + esc(titulo) + '</b><small>' + esc(min < 1 ? 'recién' : 'hace ' + min + ' min') + '</small></div>' +
    '<button data-chat="' + Number(c.id) + '">Ver chat</button>';

}

/* El navegador solo deja sonar después de un toque en la página: el primer clic prepara el audio. */
document.addEventListener('click', function(){
  if (AUDIO) return;
  try { var C = window.AudioContext || window.webkitAudioContext; if (C) AUDIO = new C(); } catch (e) { AUDIO = null; }
});
function sonar(){
  if (!SONIDO || !AUDIO) return;
  try {
    if (AUDIO.state === 'suspended') AUDIO.resume();
    [[0, 660], [0.19, 880]].forEach(function(n){
      var o = AUDIO.createOscillator(), g = AUDIO.createGain(), t = AUDIO.currentTime + n[0];
      o.type = 'sine'; o.frequency.value = n[1];
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.17);
      o.connect(g); g.connect(AUDIO.destination); o.start(t); o.stop(t + 0.19);
    });
  } catch (e) { /* sin sonido */ }
}

function opcion(texto, id, on, dis){
  return '<div class="op"><span>' + esc(texto) + '</span><button class="sw" role="switch" data-sw="' + id + '" aria-checked="' + (on ? 'true' : 'false') + '"' +
    ' aria-label="' + esc(texto) + '"' + (dis ? ' disabled' : '') + '></button></div>';
}
function pintarAvisos(){
  var b = $('#camp');
  b.innerHTML = ICO.campana + '<span>Avisos</span>' + (AV.activo ? '' : '<i>!</i>');
  b.setAttribute('aria-expanded', AV.abierto ? 'true' : 'false');
  b.title = AV.activo ? 'Avisos activados en este dispositivo' : 'Los avisos no están activados en este dispositivo';
  var p = $('#avisos');
  if (!AV.abierto) { p.hidden = true; p.innerHTML = ''; return; }
  var no = '';
  if (!AV.soporta) no = 'Este navegador no permite notificaciones. En iPhone, agrega esta página a la pantalla de inicio (Compartir, «Agregar a inicio») y ábrela desde ahí.';
  else if (AV.permiso === 'denied') no = 'Las notificaciones están bloqueadas para este sitio. Permítelas en los ajustes del navegador y recarga la página.';
  var d = AV.ocupado;
  p.innerHTML = '<h3>Avisos en este dispositivo</h3>' +

    opcion('Notificaciones', 'push', AV.activo, d || !!no) +
    opcion('Sonido con la bandeja abierta', 'sonido', SONIDO, false) +
    opcion('Recordatorios si nadie responde', 'rec', AV.recordatorios, d || !AV.activo) +
    opcion('Avisar también fuera de horario', 'fuera', AV.fuera, d || !AV.activo) +
    '<div class="bots"><button class="btn ok" data-prueba' + (d || !AV.activo ? ' disabled' : '') + '>' + (d ? 'Un momento…' : 'Enviarme un aviso de prueba') + '</button></div>' +
    '<p class="nota">' + esc(AV.nota || 'Horario: lunes a viernes de 9:00 a 17:30 y sábado de 10:00 a 14:00. Fuera de ese horario solo llega el aviso de que una ventana está por cerrarse.') + '</p>';

function aBytes(s){
  var t = String(s).replace(/-/g, '+').replace(/_/g, '/'), bin = atob(t + '==='.slice((t.length + 3) % 4));
  var o = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) o[i] = bin.charCodeAt(i);
  return o;
}
function aTexto(buf){
  var b = new Uint8Array(buf), s = '';
  for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
async function iniciarAvisos(){

  if (LOCAL || !AV.soporta) { pintarAvisos(); return; }
  AV.permiso = Notification.permission;
  pintarAvisos();
  try {
    /* Tocar una notificación con la página ya abierta: el service worker pide abrir ese chat. */
    navigator.serviceWorker.addEventListener('message', function(e){
      var id = e.data && Number(e.data.abrirChat);
      if (!id || !LISTO || OCUPADO) return;
      recargar(true).then(function(){ if (chatPorId(id)) { CONFIRMA = null; abrir(id); } });
    });
    SWREG = (await navigator.serviceWorker.getRegistration()) || null;
    var s = SWREG ? await SWREG.pushManager.getSubscription() : null;
    if (s && AV.permiso === 'granted') {
      var r = await llamar('push', { accion: 'estado', endpoint: s.endpoint });
      if (r.j && r.j.ok) { AV.activo = !!r.j.activo; AV.recordatorios = r.j.recordatorios !== false; AV.fuera = r.j.fuera_horario === true; }
    }
  } catch (e) { /* sin avisos: la bandeja funciona igual */ }
  pintarAvisos();
}
async function guardarAvisos(s){
  var k = (s.toJSON() || {}).keys || {};
  var r = await llamar('push', { accion: 'guardar', endpoint: s.endpoint, p256dh: k.p256dh, auth: k.auth,
    recordatorios: AV.recordatorios, fuera_horario: AV.fuera, dispositivo: String(navigator.userAgent || '').slice(0, 200) });
  if (r.j && r.j.ok) return true;
  AV.nota = (r.j && r.j.error) || 'No se pudo guardar. Revisa la conexión.';
  return false;
}
async function activarAvisos(){
  var perm = await Notification.requestPermission();
  AV.permiso = perm;
  if (perm !== 'granted') { AV.nota = 'No se dio el permiso de notificaciones.'; return; }
  await navigator.serviceWorker.register('mensajes-sw.js', { scope: './mensajes' });
  SWREG = await navigator.serviceWorker.ready;
  var k = null;
  try { k = await llamar('push', { accion: 'clave' }); } catch (e) { k = null; }
  if (!k) { AV.nota = 'Los avisos todavía no están disponibles. Intenta de nuevo más tarde.'; return; }
  if (!k.j || !k.j.publica) { AV.nota = (k.j && k.j.error) || 'No se pudo activar. Intenta de nuevo.'; return; }
  var s = await SWREG.pushManager.getSubscription();
  /* Una inscripción hecha con otra llave (si alguna vez se cambia) no sirve: se rehace. */
  if (s && s.options && s.options.applicationServerKey && aTexto(s.options.applicationServerKey) !== k.j.publica) { await s.unsubscribe(); s = null; }

async function desactivarAvisos(){
  var s = SWREG ? await SWREG.pushManager.getSubscription() : null;
  if (s) {
    var r = await llamar('push', { accion: 'quitar', endpoint: s.endpoint });
    if (!(r.j && r.j.ok)) { AV.nota = (r.j && r.j.error) || 'No se pudo desactivar. Revisa la conexión.'; return; }

}
async function cambiarAviso(id){
  if (id === 'sonido') {
    SONIDO = !SONIDO;
    try { localStorage.setItem('cz_mensajes_sonido', SONIDO ? 'si' : 'no'); } catch (e) { /* solo esta visita */ }
    if (SONIDO) sonar();
    pintarAvisos(); return;
  }
  if (AV.ocupado) return;
  AV.ocupado = true; AV.nota = ''; pintarAvisos();
  try {
    if (LOCAL) {
      if (id === 'push') AV.activo = !AV.activo; else if (id === 'rec') AV.recordatorios = !AV.recordatorios; else AV.fuera = !AV.fuera;
      AV.nota = 'Simulado: en modo local no se inscribe nada.';
    } else if (id === 'push') {
      if (AV.activo) await desactivarAvisos(); else await activarAvisos();
    } else if (AV.activo) {
      var antes = { r: AV.recordatorios, f: AV.fuera };
      if (id === 'rec') AV.recordatorios = !AV.recordatorios; else AV.fuera = !AV.fuera;
      var s = SWREG ? await SWREG.pushManager.getSubscription() : null;
      if (!s || !(await guardarAvisos(s))) { AV.recordatorios = antes.r; AV.fuera = antes.f; if (!s) AV.nota = 'Este dispositivo perdió su inscripción. Desactiva y vuelve a activar las notificaciones.'; }
    }
  } catch (e) { AV.nota = 'No se pudo cambiar. Revisa la conexión y vuelve a intentar.'; }

}
async function avisoDePrueba(){
  if (AV.ocupado || !AV.activo) return;
  AV.ocupado = true; AV.nota = ''; pintarAvisos();
  try {
    if (LOCAL) AV.nota = 'Simulado: en modo local no se envía nada.';
    else {
      var s = SWREG ? await SWREG.pushManager.getSubscription() : null;
      if (!s) AV.nota = 'Este dispositivo perdió su inscripción. Desactiva y vuelve a activar las notificaciones.';

        var r = await llamar('push', { accion: 'prueba', endpoint: s.endpoint });
        AV.nota = (r.j && r.j.ok) ? 'Aviso enviado: debería aparecer en unos segundos.' : ((r.j && r.j.error) || 'No se pudo enviar el aviso de prueba.');
      }
    }
  } catch (e) { AV.nota = 'No se pudo enviar el aviso de prueba. Revisa la conexión.'; }
  AV.ocupado = false; pintarAvisos();
}
