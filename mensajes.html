<!--
  Bandeja de mensajes (18-11-2026) · ETAPA 2: LEER, EDITAR Y ENVIAR CON APROBACIÓN.
  Muestra los chats que llegan al WhatsApp de la bandeja (+56 9 9305 1122) por la API oficial
  de Meta y el borrador que deja Claude para cada uno. Una persona lo revisa, lo edita si quiere
  y aprieta Enviar (con confirmación). Nada sale automático.
  Datos: tablas mensajes_chats / mensajes / mensajes_borradores del proyecto Cotizador
  (migraciones 0004 y 0006 y función mensajes-webhook, en el repo de Gestión: supabase-cotizador/).
  Esta página NO escribe en la base: Enviar y «Tomar este chat» llaman a la función
  (rutas /enviar y /tomar) con la sesión del usuario, y es la base la que acepta o rechaza
  (ventana de 24 horas, tope de 2 sin respuesta, chat tomado, texto). Quién ve qué lo decide RLS.
  Probar en el PC: localhost + ?local lee mensajes-local.json (datos de mentira; el envío se simula).
-->

<script>

/* Probar en el PC: localhost + ?local lee mensajes-local.json (datos de mentira, nada de la base). */

function $(s){ return document.querySelector(s); }

  lapiz: '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',

/* ── Formato ─────────────────────────────────────────────────────────── */
function dos(n){ return (n < 10 ? '0' : '') + n; }
function hora(d){ return dos(d.getHours()) + ':' + dos(d.getMinutes()); }
function diaCorto(d){ return dos(d.getDate()) + '-' + dos(d.getMonth() + 1); }
function mismoDia(a, b){ return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
function cuando(iso){
  if (!iso) return '';
  var d = new Date(iso); if (isNaN(d.getTime())) return '';
  return mismoDia(d, new Date()) ? hora(d) : diaCorto(d) + ' ' + hora(d);
}
function corta(s, n){ s = String(s == null ? '' : s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function telBonito(t){
  var d = String(t == null ? '' : t).replace(/\D/g, '');
  if (!d) return '';
  if (d.length === 11 && d.indexOf('569') === 0) return '+56 9 ' + d.slice(3, 7) + ' ' + d.slice(7);
  return '+' + d;
}
function nombre(c){ return c.nombre || telBonito(c.telefono) || (c.canal === 'instagram' ? 'Cliente de Instagram' : 'Cliente'); }
function iniciales(c){
  var n = String(c.nombre || '').trim();
  if (n) { var p = n.split(/\s+/); return (p[0].charAt(0) + (p[1] ? p[1].charAt(0) : '')).toUpperCase(); }
  var d = String(c.telefono || '').replace(/\D/g, '');
  return d ? d.slice(-2) : '··';
}
function anuncio(c){ var o = c.origen || {}; return o.headline || o.ad_title || ''; }
var TIPOS = { image: 'foto', audio: 'audio', video: 'video', document: 'documento', sticker: 'sticker', location: 'ubicación', contacts: 'contacto', reaction: 'reacción', adjunto: 'archivo adjunto' };
function textoMsg(m){ return m.texto || (m.tipo && m.tipo !== 'text' ? '[' + (TIPOS[m.tipo] || m.tipo) + ']' : '[mensaje sin texto]'); }
function ventana(c){
  if (!c.ultimo_entrante_at) return { abierta: false, texto: 'El cliente todavía no escribe.' };
  var ms = new Date(c.ultimo_entrante_at).getTime() + 24 * 3600000 - Date.now();
  if (!(ms > 0)) return { abierta: false, texto: 'Ventana de 24 horas cerrada: solo se le puede escribir con una plantilla aprobada.' };
  var h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
  return { abierta: true, texto: 'Ventana de 24 horas abierta: quedan ' + (h ? h + ' h ' : '') + m + ' min para responder con texto libre.' };
}
function chatPorId(id){ for (var i = 0; i < CHATS.length; i++) if (Number(CHATS[i].id) === Number(id)) return CHATS[i]; return null; }

/* ── Pantallas ───────────────────────────────────────────────────────── */
function bloquear(t, p){ $('#main').innerHTML = '<div class="bloqueo"><h2>' + esc(t) + '</h2><p>' + esc(p) + '</p></div>'; $('#sub').textContent = ''; }
function formLogin(){
  bloquear('Mensajes', 'Entra con tu correo y contraseña del panel de Casa Zaru.');
  $('.bloqueo').insertAdjacentHTML('beforeend',

    '<button class="btn ok" type="submit">Entrar</button><p class="msgl" id="lg-msg"></p></form>');
  $('#login').onsubmit = async function(e){
    e.preventDefault(); $('#lg-msg').textContent = 'Entrando…';

    if (x.error) { $('#lg-msg').textContent = 'Correo o contraseña incorrectos.'; return; }

}

function fila(c){
  var u = ULT[c.id], b = BORR[c.id], rev = (b && b.revision) || {};
  var chips = '<span class="chip ' + (c.canal === 'instagram' ? 'ig' : 'wa') + '">' + (c.canal === 'instagram' ? 'Instagram' : 'WhatsApp') + '</span>';
  var an = anuncio(c);
  if (an) chips += '<span class="chip">' + esc(corta('Anuncio: ' + an, 34)) + '</span>';
  if (rev.necesita_humano) chips += '<span class="chip r">Necesita una persona</span>';
  if (rev.falta_precio) chips += '<span class="chip a">Falta un precio</span>';
  if (!ventana(c).abierta) chips += '<span class="chip a">Fuera de 24 h</span>';
  return '<button class="fila" data-chat="' + Number(c.id) + '"><span class="ini">' + esc(iniciales(c)) + '</span><span class="txt">' +
    '<span class="l1"><span class="nom">' + esc(nombre(c)) + '</span><span class="hora">' + esc(cuando(u ? u.enviado_at : c.ultimo_entrante_at)) + '</span></span>' +
    '<span class="ult">' + esc(u ? (u.autor !== 'cliente' ? 'Nosotros: ' : '') + textoMsg(u) : 'Sin mensajes') + '</span>' +
    (b ? '<span class="borr">' + esc(b.texto) + '</span>' : '') +
    '<span class="chips">' + chips + '</span></span></button>';
}
function renderLista(){
  var g = { por_aprobar: [], de_cesar: [], esperando: [] };
  CHATS.forEach(function(c){ if (g[c.estado]) g[c.estado].push(c); });
  var h = '<div class="tabs">' + TABS.map(function(t){
    return '<button class="tab' + (TAB === t.k ? ' on' : '') + '" data-tab="' + t.k + '">' + esc(t.n) + ' · ' + g[t.k].length + '</button>';
  }).join('') + '</div>';
  h += g[TAB].length ? g[TAB].map(fila).join('') : '<p class="vacio">' + esc(VACIO[TAB]) + '</p>';
  $('#main').innerHTML = h;
  $('#sub').textContent = g.por_aprobar.length + ' por aprobar · actualizado ' + hora(new Date());
}

function chk(ok, si, no){ return '<li' + (ok ? '' : ' class="no"') + '>' + (ok ? ICO.si : ICO.no) + '<span>' + esc(ok ? si : no) + '</span></li>'; }
/* Quién lleva el chat y qué puedo hacer yo (la función y la base lo vuelven a comprobar). */
function quienLleva(c){
  var t = String(c.tomado_por || '').toLowerCase();
  if (!t) return '';
  if (t === 'cesar') return 'César';
  if (MI_MAIL && t === MI_MAIL) return 'tú';
  return VEND[t] || (t === ADMIN_MAIL ? 'Tomás' : t.split('@')[0]);
}
function puedoEscribir(c){
  var t = String(c.tomado_por || '').toLowerCase();
  return !t || t === MI_MAIL || MI_MAIL === ADMIN_MAIL;
}
function motivoNoEnviar(c){
  if (c.canal !== 'whatsapp') return 'Por ahora solo se puede enviar por WhatsApp.';
  if (!ventana(c).abierta) return 'No se puede enviar: la ventana de 24 horas está cerrada.';
  if ((Number(c.toques_sin_respuesta) || 0) >= 2) return 'No se puede enviar: ya van 2 mensajes sin respuesta y no se insiste.';
  if (!puedoEscribir(c)) return 'No se puede enviar: este chat lo lleva ' + quienLleva(c) + '.';
  return '';
}
function textoActual(c, b){ return EDIT[c.id] != null ? EDIT[c.id] : (b ? b.texto : ''); }

function redaccionHtml(c, b){
  var rev = (b && b.revision) || {};
  var t = Number(c.toques_sin_respuesta) || 0;
  var no = motivoNoEnviar(c);
  var fijo = OCUPADO || CONFIRMA === 'enviar';
  var dis = OCUPADO ? ' disabled' : '';
  var h = '<div class="draft"><div class="lab">' + ICO.lapiz + esc(b ? (b.para === 'cesar' ? 'Sugerencia de Claude' : 'Borrador de Claude') : 'Tu respuesta') + '</div>' +
    '<textarea id="txt" rows="7" maxlength="4000" placeholder="Escribe la respuesta…"' + (fijo ? ' readonly' : '') + '>' + esc(textoActual(c, b)) + '</textarea>';
  if (b) {
    var ch = chk(!c.tomado_por, 'Nadie ha tomado este chat', 'Chat tomado: aquí nada sale automático') +
      chk(t < 2, 'Mensajes sin respuesta: ' + t + ' de 2', 'Ya van ' + t + ' mensajes sin respuesta: no insistir') +
      chk(rev.sin_palabras_prohibidas !== false, 'Sin palabras ni signos prohibidos', 'Revisar: usa una palabra o signo prohibido');
    if (rev.falta_precio) ch += chk(false, '', 'Falta completar un precio (busca [PRECIO: …] en el texto)');

    h += '<ul class="checks">' + ch + '</ul>';
  }
  h += '</div>';
  if (CONFIRMA === 'enviar') {
    return h + '<div class="conf"><p>Se enviará por WhatsApp a <b>' + esc(nombre(c)) + '</b>' +
      (c.nombre && c.telefono ? ' (' + esc(telBonito(c.telefono)) + ')' : '') + '. No se puede deshacer.</p>' +
      '<div class="bots"><button class="btn ok" data-confirmar="enviar"' + dis + '>' + (OCUPADO ? 'Enviando…' : 'Sí, enviar') + '</button>' +
      '<button class="btn" data-cancelar' + dis + '>Cancelar</button></div></div>';
  }
  if (CONFIRMA === 'tomar') {
    return h + '<div class="conf"><p>El chat queda a tu nombre y ya no vuelve a «Por aprobar». Claude te sigue sugiriendo respuestas, pero aquí nunca saldrá nada automático.</p>' +
      '<div class="bots"><button class="btn ok" data-confirmar="tomar"' + dis + '>' + (OCUPADO ? 'Guardando…' : 'Sí, tomar') + '</button>' +
      '<button class="btn" data-cancelar' + dis + '>Cancelar</button></div></div>';
  }
  h += '<div class="bots"><button class="btn ok" data-enviar' + (no ? ' disabled' : '') + '>Enviar</button><button class="btn" data-copiar>Copiar</button></div>';
  if (no) h += '<p class="nota aviso">' + esc(no) + '</p>';
  if (b && EDIT[c.id] != null && EDIT[c.id] !== b.texto) h += '<p class="nota"><button class="link" data-restaurar>Volver al borrador de Claude</button></p>';
  if (!c.tomado_por) h += '<p class="nota"><button class="link" data-tomar>Tomar este chat</button></p>';
  return h;
}
function burbujas(){
  var h = '', ant = null;
  MSGS.forEach(function(m){
    var d = new Date(m.enviado_at);
    if (!isNaN(d.getTime()) && (!ant || !mismoDia(ant, d))) { h += '<div class="dia">' + esc(mismoDia(d, new Date()) ? 'Hoy' : diaCorto(d)) + '</div>'; ant = d; }
    var mio = m.autor !== 'cliente';
    var quien = m.autor === 'automatico' ? ' · automático' : (m.autor === 'externo' ? ' · desde el celular' : (m.autor === 'bandeja' ? ' · ' + (m.enviado_por || 'bandeja') : ''));
    h += '<div class="msg' + (mio ? ' yo' : '') + '">' + esc(textoMsg(m)).replace(/\n/g, '<br>') +
      '<small>' + esc((isNaN(d.getTime()) ? '' : hora(d)) + (mio ? quien : '')) + '</small></div>';
  });
  return h;
}
function renderChat(){
  var c = chatPorId(ABIERTO);
  if (!c) { ABIERTO = null; renderLista(); return; }
  var b = BORR[c.id], v = ventana(c), an = anuncio(c);
  var sub = (c.canal === 'instagram' ? 'Instagram' : 'WhatsApp') + (c.nombre && c.telefono ? ' · ' + telBonito(c.telefono) : '') + (an ? ' · Anuncio: ' + an : '');
  var h = '<div class="cab"><button class="atras" data-atras aria-label="Volver a la lista">' + ICO.atras + '</button><div><b>' + esc(nombre(c)) + '</b><small>' + esc(sub) + '</small></div></div>';
  h += '<div class="chat">' + (MSGS.length ? burbujas() : '<p class="vacio">Cargando mensajes…</p>') + '</div>';
  h += '<div class="vent' + (v.abierta ? '' : ' no') + '">' + ICO.reloj + '<span>' + esc(v.texto) + '</span></div>';
  if (c.tomado_por) {
    var ql = quienLleva(c);
    h += '<div class="bloq">' + ICO.candado + '<span>' + esc(ql === 'tú' ? 'Este chat lo llevas tú.' : 'Este chat lo lleva ' + ql + '.') + ' Aquí nada sale automático.</span></div>';
  }
  h += redaccionHtml(c, b);
  $('#main').innerHTML = h;
}
function render(){
  if (ABIERTO) {
    renderChat();
    var n = CHATS.filter(function(c){ return c.estado === 'por_aprobar'; }).length;
    $('#sub').textContent = n + ' por aprobar · actualizado ' + hora(new Date());
  } else renderLista();
}

/* ── Datos (solo lectura) ────────────────────────────────────────────── */
async function cargarDatos(){
  var chats, msgs, borrs;
  if (LOCAL) {
    /* El archivo se lee una sola vez: después los datos de mentira viven en memoria, para poder simular envíos. */
    if (!LOCAL_DATOS) {
      var j = await (await fetch('mensajes-local.json', { cache: 'no-store' })).json();
      var isoHace = function(min){ return new Date(Date.now() - min * 60000).toISOString(); };
      j.chats.forEach(function(c){ c.ultimo_entrante_at = c._hace_min == null ? null : isoHace(c._hace_min); });
      j.mensajes.forEach(function(m){ m.enviado_at = isoHace(m._hace_min); });
      LOCAL_DATOS = j;
    }
    chats = LOCAL_DATOS.chats.filter(function(c){ return c.estado !== 'cerrado'; });
    msgs = []; LOCAL_MSGS = {};
    LOCAL_DATOS.mensajes.forEach(function(m){ (LOCAL_MSGS[m.chat_id] = LOCAL_MSGS[m.chat_id] || []).push(m); msgs.push(m); });
    msgs.sort(function(a, b){ return a.enviado_at < b.enviado_at ? 1 : -1; });
    borrs = LOCAL_DATOS.borradores;
  } else {
    var r = await Promise.all([
      sb.from('mensajes_chats').select('id,canal,nombre,telefono,estado,tomado_por,origen,ultimo_entrante_at,toques_sin_respuesta')
        .is('deleted_at', null).neq('estado', 'cerrado').order('ultimo_entrante_at', { ascending: false, nullsFirst: false }).limit(300),
      sb.from('mensajes').select('chat_id,autor,tipo,texto,enviado_at').order('enviado_at', { ascending: false }).limit(800),
      sb.from('mensajes_borradores').select('id,chat_id,texto,revision,para,created_at').eq('estado', 'pendiente').order('created_at', { ascending: false }).limit(300)
    ]);
    if (r[0].error || r[1].error || r[2].error) throw new Error('consulta');
    chats = r[0].data || []; msgs = r[1].data || []; borrs = r[2].data || [];
  }
  CHATS = chats; ULT = {}; BORR = {};
  msgs.forEach(function(m){ if (!ULT[m.chat_id]) ULT[m.chat_id] = m; });       /* vienen del más nuevo al más viejo */
  borrs.forEach(function(b){ if (!BORR[b.chat_id]) BORR[b.chat_id] = b; });
}
async function cargarMsgs(id){
  if (LOCAL) { MSGS = (LOCAL_MSGS[id] || []).slice().sort(function(a, b){ return a.enviado_at < b.enviado_at ? -1 : 1; }); return; }
  var r = await sb.from('mensajes').select('id,autor,tipo,texto,enviado_at,enviado_por').eq('chat_id', Number(id)).order('enviado_at', { ascending: true }).limit(400);
  if (r.error) throw new Error('mensajes');
  MSGS = r.data || [];
}
function firma(){ return JSON.stringify([CHATS, BORR, ABIERTO, MSGS.length]); }
async function recargar(silencio){
  try {
    await cargarDatos();
    if (ABIERTO) await cargarMsgs(ABIERTO);
    var f = firma();
    if (!silencio || f !== FIRMA) render();      /* al refrescar solo, no se repinta si nada cambió */
    FIRMA = f;
    if (!silencio) toast('Actualizado.');
  } catch (e) { if (!silencio) toast('No se pudo actualizar. Revisa la conexión.'); }
}
async function abrir(id){
  ABIERTO = Number(id); MSGS = []; render(); window.scrollTo(0, 0);
  try { await cargarMsgs(ABIERTO); } catch (e) { toast('No se pudieron cargar los mensajes.'); }
  FIRMA = firma(); render();
}
async function copiar(){
  var c = chatPorId(ABIERTO); if (!c) return;
  var t = String(textoActual(c, BORR[c.id]) || '');
  if (!t.trim()) { toast('No hay texto para copiar.'); return; }
  try { await navigator.clipboard.writeText(t); toast('Texto copiado.'); }
  catch (e) {
    var ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Texto copiado.'); } catch (e2) { toast('No se pudo copiar.'); }
    document.body.removeChild(ta);
  }
}

/* ── Enviar y tomar: van por la función, con la sesión del usuario ────── */
function nuevaClave(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'c-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
}
async function llamar(ruta, cuerpo){
  var s = await sb.auth.getSession();
  var tok = s && s.data && s.data.session && s.data.session.access_token;
  if (!tok) return { status: 401, j: { error: 'Tu sesión venció. Recarga la página y vuelve a entrar.' } };
  var r = await fetch(SB_URL + '/functions/v1/mensajes-webhook/' + ruta, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok, 'apikey': SB_KEY },
    body: JSON.stringify(cuerpo)
  });
  var j = null;
  try { j = await r.json(); } catch (e) { j = null; }
  return { status: r.status, j: j || {} };
}
async function pedirEnvio(){
  var c = chatPorId(ABIERTO); if (!c || OCUPADO) return;
  var no = motivoNoEnviar(c);
  if (no) { toast(no, 5000); return; }
  var texto = String(textoActual(c, BORR[c.id]) || '').trim();
  if (!texto) { toast('Escribe el mensaje antes de enviar.'); return; }
  if (texto.indexOf('[PRECIO') !== -1) { toast('Falta completar un precio: busca [PRECIO: …] en el texto.', 5000); return; }
  /* Antes de confirmar se vuelve a leer el chat. La pantalla se refresca cada minuto, así que el cliente
     pudo escribir algo que todavía no se ve: en ese caso primero se muestra, y recién después se envía. */
  var antes = MSGS.length;
  OCUPADO = true;
  try { await cargarDatos(); await cargarMsgs(ABIERTO); }
  catch (e) { OCUPADO = false; toast('No se pudo revisar el chat. Mira la conexión y vuelve a intentar.', 5000); return; }
  OCUPADO = false; FIRMA = firma();
  c = chatPorId(ABIERTO);
  if (!c) { ABIERTO = null; render(); return; }
  if (MSGS.length !== antes) { render(); toast('Llegó un mensaje nuevo en este chat. Léelo antes de enviar.', 6000); return; }
  no = motivoNoEnviar(c);
  if (no) { render(); toast(no, 5000); return; }
  CONFIRMA = 'enviar'; render();
}
async function enviarConfirmado(){
  var c = chatPorId(ABIERTO); if (!c || OCUPADO) return;
  var b = BORR[c.id];
  var texto = String(textoActual(c, b) || '').trim();
  if (!texto) { CONFIRMA = null; render(); toast('El mensaje está vacío.'); return; }
  /* La misma clave mientras el texto no cambie: si la red falla y se reintenta, el mensaje no sale dos veces. */
  var k = CLAVE[c.id];
  if (!k || k.texto !== texto) k = CLAVE[c.id] = { texto: texto, clave: nuevaClave() };
  OCUPADO = true; render();
  var res = null;
  try {
    if (LOCAL) {
      await new Promise(function(r){ setTimeout(r, 700); });
      LOCAL_DATOS.mensajes.push({ id: Date.now(), chat_id: c.id, autor: 'bandeja', tipo: 'text', texto: texto, enviado_por: 'modo local', enviado_at: new Date().toISOString() });
      LOCAL_DATOS.borradores = LOCAL_DATOS.borradores.filter(function(x){ return x.chat_id !== c.id; });
      c.toques_sin_respuesta = (Number(c.toques_sin_respuesta) || 0) + 1;
      if (!c.tomado_por) c.estado = 'esperando';
      res = { status: 200, j: { ok: true } };
    } else {
      res = await llamar('enviar', { chat_id: Number(c.id), texto: texto, clave: k.clave, borrador_id: b ? Number(b.id) : null });
    }
  } catch (e) { res = null; }
  OCUPADO = false; CONFIRMA = null;
  if (!res) { render(); toast('No hubo respuesta. Toca Actualizar y mira si el mensaje salió antes de reintentar.', 6000); return; }
  if (res.j && res.j.ok) {
    delete CLAVE[c.id]; delete EDIT[c.id];
    await recargar(true); render();
    toast(res.j.aviso || (LOCAL ? 'Simulado: en modo local no se envía nada.' : 'Enviado.'), res.j.aviso ? 6000 : 2600);
    return;
  }
  if (res.j && res.j.definitivo) delete CLAVE[c.id];
  render(); toast((res.j && res.j.error) || 'No se pudo enviar.', 6000);
}
async function tomarConfirmado(){
  var c = chatPorId(ABIERTO); if (!c || OCUPADO) return;
  OCUPADO = true; render();
  var res = null;
  try {
    if (LOCAL) {
      await new Promise(function(r){ setTimeout(r, 400); });
      c.estado = 'de_cesar'; c.tomado_por = MI_MAIL || 'tu@prueba.cl';
      LOCAL_DATOS.borradores.forEach(function(x){ if (x.chat_id === c.id) x.para = 'cesar'; });
      res = { status: 200, j: { ok: true } };
    } else {
      res = await llamar('tomar', { chat_id: Number(c.id) });
    }
  } catch (e) { res = null; }
  OCUPADO = false; CONFIRMA = null;
  if (res && res.j && res.j.ok) { await recargar(true); render(); toast('El chat quedó a tu nombre.'); return; }
  await recargar(true); render();
  toast((res && res.j && res.j.error) || 'No se pudo tomar el chat. Revisa la conexión.', 5000);
}

/* Un solo listener para todo (los botones se repintan). */
document.addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b || !LISTO) return;
  if (b.dataset.tab) { TAB = b.dataset.tab; render(); return; }
  if (b.dataset.chat) { CONFIRMA = null; abrir(b.dataset.chat); return; }
  if (b.hasAttribute('data-atras')) { if (OCUPADO) return; ABIERTO = null; MSGS = []; CONFIRMA = null; FIRMA = firma(); render(); window.scrollTo(0, 0); return; }
  if (b.hasAttribute('data-copiar')) { copiar(); return; }
  if (b.hasAttribute('data-enviar')) { pedirEnvio(); return; }
  if (b.hasAttribute('data-tomar')) { if (!OCUPADO) { CONFIRMA = 'tomar'; render(); } return; }
  if (b.hasAttribute('data-cancelar')) { if (!OCUPADO) { CONFIRMA = null; render(); } return; }
  if (b.hasAttribute('data-restaurar')) { if (ABIERTO) { delete EDIT[ABIERTO]; delete CLAVE[ABIERTO]; render(); } return; }
  if (b.dataset.confirmar === 'enviar') { enviarConfirmado(); return; }
  if (b.dataset.confirmar === 'tomar') { tomarConfirmado(); return; }
});
/* Lo que se escribe queda guardado por chat: un repintado no lo pierde. */
document.addEventListener('input', function(e){ if (e.target && e.target.id === 'txt' && ABIERTO) EDIT[ABIERTO] = e.target.value; });
function escribiendo(){ return !!(document.activeElement && document.activeElement.id === 'txt'); }

async function cargar(){
  if (!LOCAL) {
    var r = await sb.auth.getSession();
    var sess = r && r.data && r.data.session;
    if (!sess) { formLogin(); return; }
    $('#salir').hidden = false;
    MI_MAIL = ((sess.user && sess.user.email) || '').toLowerCase();
    /* Solo para mostrar un aviso claro: lo que protege es RLS (0004). */
    var p = await sb.rpc('mensajes_puede_leer');
    if (p.error || p.data !== true) { bloquear('Tu cuenta no tiene acceso a Mensajes', 'Si lo necesitas, pídeselo a Casa Zaru.'); return; }
    /* Nombres para mostrar quién lleva cada chat (si no se pueden leer, se muestra el correo recortado). */
    var v = await sb.from('vendedores').select('email,nombre');
    (v.data || []).forEach(function(x){ if (x.email && x.nombre) VEND[String(x.email).toLowerCase()] = x.nombre; });
  }
  if (LOCAL) MI_MAIL = 'tu@prueba.cl';
  await cargarDatos();
  LISTO = true; FIRMA = firma();
  $('#act').hidden = false;
  render();
  /* Se refresca sola, salvo mientras alguien escribe, confirma o hay un envío en curso. */
  setInterval(function(){ if (!document.hidden && !OCUPADO && !CONFIRMA && !escribiendo()) recargar(true); }, 60000);
}
$('#salir').onclick = async function(){ await sb.auth.signOut(); location.replace(AQUI); };
$('#act').onclick = function(){ recargar(false); };
cargar().catch(function(){ bloquear('No se pudieron cargar los mensajes', 'Revisa la conexión y recarga la página.'); });
</script>
