<!--

  Esta página NO trae datos: el índice (datos.json) y las miniaturas (s00.jpg…)
  viven en el bucket PRIVADO «fototeca» del proyecto Cotizador
  (supabase-cotizador/fototeca-bucket.sql en el repo de Gestión). Sin la sesión
  del panel no se ve nada. El repo es público: nunca subir esos archivos acá.
  Desde el 11-11-2026 el admin corrige la clasificación, marca IA y manda a la
  papelera; eso vive en la tabla fototeca_ediciones y se escribe SOLO con la

  padding:env(safe-area-inset-top,0px) max(0px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(0px,env(safe-area-inset-left,0px))}
@media (min-width:900px){.ficha{left:auto;width:520px;box-shadow:-10px 0 30px var(--sombra)} .velo{position:fixed;inset:0;background:rgba(10,12,9,.45);z-index:20}}

.fbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.volver{font:inherit;font-size:1rem;font-weight:600;color:var(--verde);background:transparent;border:0;padding:6px 4px;cursor:pointer}

.media{position:relative;margin:12px 16px 0;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background-color:var(--line);background-repeat:no-repeat;touch-action:pan-y}
.media iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.media .play{position:absolute;inset:0;margin:auto;width:66px;height:66px;border-radius:50%;border:0;background:rgba(0,0,0,.58);color:#fff;font-size:1.5rem;padding-left:5px;cursor:pointer}
.media .flecha{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.88);color:#22261f;font-size:1.3rem;font-weight:700;cursor:pointer;z-index:2;display:grid;place-items:center;padding:0 0 3px}

.cuerpo{padding:12px 16px 28px;display:grid;gap:10px}

.meta{color:var(--muted);font-size:.8rem}
.desc{margin:0}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}

.etq{display:flex;flex-wrap:wrap;gap:5px}

.nota{color:var(--muted);font-size:.78rem;margin:0}
/* formulario de edición */
.campo{display:grid;gap:4px}
.campo select,.campo input,.campo textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:none;width:100%}
.campo textarea{min-height:90px;resize:vertical}
.estrellas{display:flex;gap:2px}

/* papelera */
.papel-cab{display:grid;gap:10px;margin-bottom:12px}

.papelito{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

/* aviso flotante */

@media (prefers-reduced-motion:no-preference){.item{transition:transform .12s}.item:hover{transform:scale(1.02)}}
</style>

<body>
<header><div class="wrap">

</div></header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
var SB_URL = 'https://cmxqorsyxoltrakxawro.supabase.co';
var SB_KEY = 'sb_publishable_Z4Bu9BnRkjiKmuCUzUGz0Q_hwxOc-Go';
var BUCKET = 'fototeca';
var ADMIN_MAIL = 'hola@casazaru.cl';   /* solo cosmético: lo que protege es la función fototeca_editar() */
var FIRMA_SEG = 12 * 3600;   /* las URLs firmadas duran 12 horas; después, recargar */
/* solo para probar en el PC (localhost + ?local): lee los archivos de la carpeta; ?local&admin simula al admin sin guardar */
var LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]local\b/.test(location.search);

var ETQ = {producto:'Producto', madera:'Madera', anio:'Año', tipo:'Foto o video', uso:'Uso', ambiente:'Ambiente'};
var EDITABLES = ['producto','madera','uso','calidad','ia','descripcion','etiquetas','ambiente','etapa'];
var USOS = ['catálogo','anuncio','instalado donde el cliente','proceso taller','detalle de madera','descartar'];
var PASO = 120, DATA = [], DATA_BY = {}, META = {}, SPR = {}, vista = [], mostrados = 0;
var ES_ADMIN = false, ED = {}, SEL = {}, MODO_SEL = false, ACTUAL = null, EDITANDO = false;
function $(s){ return document.querySelector(s); }
function norm(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function esIA(d){ return d.ia==='sí' || d.ia==='posible'; }
function fmtDur(s){ s = +s||0; return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function nomSprite(n){ return 's'+String(n).padStart(2,'0')+'.jpg'; }
function titulo(d){ return (d.producto||'Archivo')+(d.madera&&d.madera!=='no se distingue'?' de '+d.madera:''); }
var tt; function aviso(t){ var e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(tt); tt = setTimeout(function(){ e.hidden = true; }, 2600); }

function bloquear(titulo, texto){
  $('#cuenta').textContent = '';
  $('#bloqueo').innerHTML = '<h2>'+esc(titulo)+'</h2><p>'+texto+'</p>';
  $('#bloqueo').hidden = false;
}
function sprite(el, d, lado){
  var k = lado / META.celda, u = SPR[d.s];
  if (!u) return;
  el.style.backgroundImage = 'url("'+u+'")';
  el.style.backgroundSize = (META.cols*META.celda*k)+'px '+(META.filas*META.celda*k)+'px';
  el.style.backgroundPosition = (-d.x*META.celda*k)+'px '+(-d.y*META.celda*k)+'px';
}

/* ── correcciones del admin encima del índice ── */
function aplicar(d){
  if (!d._orig) { d._orig = {}; EDITABLES.forEach(function(k){ d._orig[k] = d[k]; }); }
  var e = ED[d.id], c = (e && e.campos) || {};
  EDITABLES.forEach(function(k){ d[k] = (k in c) ? c[k] : d._orig[k]; });
  d._pap = !!(e && e.en_papelera_at && !e.eliminada_at);
  d._elim = !!(e && e.eliminada_at);
  d._txt = norm([d.id,d.producto,d.madera,d.tipo,d.etapa,d.ambiente,d.forma,d.uso,d.descripcion,d.gancho,d.que_pasa,(d.etiquetas||[]).join(' '),d.ruta,d.nombre,d.anio].join(' '));
}
async function cargarEdiciones(){
  if (LOCAL) return;
  for (var a = 0; ; a += 1000) {
    var r = await sb.from('fototeca_ediciones').select('item_id,campos,en_papelera_at,eliminada_at').order('item_id').range(a, a+999);
    if (r.error) { if (a === 0) console.warn('ediciones', r.error.message); return; }
    r.data.forEach(function(x){ ED[x.item_id] = x; });
    if (r.data.length < 1000) return;
  }
}
/* único camino de escritura: la función fototeca_editar() de la base */
async function editar(ids, accion, campos){
  if (!LOCAL) {
    var r = await sb.rpc('fototeca_editar', { p_ids: ids, p_accion: accion, p_campos: campos || {} });
    if (r.error) { aviso('No se guardó: '+r.error.message); return false; }
  }
  var ahora = new Date().toISOString();
  if (accion === 'vaciar') {
    Object.keys(ED).forEach(function(k){ var e = ED[k]; if (e.en_papelera_at && !e.eliminada_at) { e.eliminada_at = ahora; if (DATA_BY[k]) aplicar(DATA_BY[k]); } });
    return true;
  }
  ids.forEach(function(id){
    var e = ED[id] || (ED[id] = { item_id: id, campos: {}, en_papelera_at: null, eliminada_at: null });
    if (accion === 'campos') e.campos = Object.assign({}, e.campos, campos);

  META = j.meta; DATA = j.items;
  DATA.forEach(function(d){ DATA_BY[d.id] = d; aplicar(d); });
  $('#controles').hidden = false;
  if (ES_ADMIN) { $('#f-sel').hidden = false; $('#f-papelera').hidden = false; }
  opciones();
  $('#sugerencias').innerHTML = (META.sugerencias||[]).map(function(s){ return '<button class="sug">'+esc(s)+'</button>'; }).join('');
  $('#sugerencias').querySelectorAll('.sug').forEach(function(b){ b.onclick = function(){ $('#q').value = b.textContent; filtrar(); }; });
  if (location.hash) history.replaceState(null, '', location.pathname + location.search);
  filtrar();
}
function sprites(){
  var n = {}; DATA.forEach(function(d){ n[d.s] = 1; });
  return Object.keys(n).map(Number);
}
/* Inicio de sesión propio (09-11-2026): quien solo tiene acceso a la Fototeca (la persona de
   contenido) entra por aquí sin pasar por el panel. La sesión es la misma del sitio, así que
   el equipo que ya inició sesión en el panel entra directo. Qué ve cada cuenta lo decide RLS. */
var HASH0 = location.hash;   /* supabase-js limpia el #… del link del correo al iniciar: leerlo antes */
var sb = LOCAL ? null : supabase.createClient(SB_URL, SB_KEY);
var AQUI = location.origin + location.pathname;
function formLogin(msg){
  bloquear('Fototeca de Casa Zaru', 'Entra con el correo y la contraseña que te dio Casa Zaru.');
  $('#bloqueo').insertAdjacentHTML('beforeend',
    '<form class="login" id="login"><label>Correo<input type="email" id="lg-mail" autocomplete="username" required></label>'+
    '<label>Contraseña<input type="password" id="lg-clave" autocomplete="current-password" required></label>'+
    '<button class="btn" type="submit">Entrar</button><p class="msg" id="lg-msg">'+esc(msg||'')+'</p>'+
    '<button class="link" type="button" id="lg-olvido">Primera vez u olvidé mi contraseña</button></form>');
  $('#login').onsubmit = async function(e){
    e.preventDefault(); $('#lg-msg').textContent = 'Entrando…';
    var x = await sb.auth.signInWithPassword({ email: $('#lg-mail').value.trim(), password: $('#lg-clave').value });
    if (x.error) { $('#lg-msg').textContent = 'Correo o contraseña incorrectos.'; return; }
    location.reload();
  };
  $('#lg-olvido').onclick = async function(){
    var m = $('#lg-mail').value.trim();
    if (!m) { $('#lg-msg').textContent = 'Escribe tu correo arriba y vuelve a tocar aquí.'; return; }
    $('#lg-msg').textContent = 'Enviando…';
    var x = await sb.auth.resetPasswordForEmail(m, { redirectTo: AQUI });
    $('#lg-msg').textContent = x.error ? 'No se pudo enviar. Intenta en unos minutos.' :
      'Si ese correo tiene acceso, te llegó un link para crear tu contraseña.';
  };
}
function formClave(){
  bloquear('Crea tu contraseña', 'Elige una contraseña de al menos 8 caracteres.');
  $('#bloqueo').insertAdjacentHTML('beforeend',
    '<form class="login" id="clave"><label>Contraseña nueva<input type="password" id="cl-1" autocomplete="new-password" minlength="8" required></label>'+
    '<label>Repítela<input type="password" id="cl-2" autocomplete="new-password" minlength="8" required></label>'+
    '<button class="btn" type="submit">Guardar y entrar</button><p class="msg" id="cl-msg"></p></form>');
  $('#clave').onsubmit = async function(e){
    e.preventDefault();
    if ($('#cl-1').value !== $('#cl-2').value) { $('#cl-msg').textContent = 'No coinciden.'; return; }
    $('#cl-msg').textContent = 'Guardando…';
    var x = await sb.auth.updateUser({ password: $('#cl-1').value });
    if (x.error) { $('#cl-msg').textContent = 'El link venció. Vuelve a pedirlo desde «Primera vez».'; return; }
    location.replace(AQUI);
  };
}
async function cargar(){
  if (LOCAL) {
    var j = await (await fetch('fototeca-local/datos.json')).json();
    META = j.meta; DATA = j.items;
    sprites().forEach(function(s){ SPR[s] = 'fototeca-local/'+nomSprite(s); });
    ES_ADMIN = /[?&]admin\b/.test(location.search);
    arrancar(j); return;
  }
  var r = await sb.auth.getSession();
  var sess = r && r.data && r.data.session;
  if (sess && /type=(recovery|invite)/.test(HASH0)) { formClave(); return; }
  if (!sess) { formLogin(); return; }
  $('#salir').hidden = false;
  ES_ADMIN = (sess.user && (sess.user.email||'').toLowerCase()) === ADMIN_MAIL;
  var a = await sb.storage.from(BUCKET).createSignedUrl('datos.json', FIRMA_SEG);
  if (a.error || !a.data) {
    bloquear('Esta cuenta no tiene acceso a la Fototeca',
      'Si deberías verla, pídele a Casa Zaru que agregue tu correo.');
    return;
  }
  var j2 = await (await fetch(a.data.signedUrl)).json();
  DATA = j2.items;
  var nombres = sprites().map(nomSprite);
  var b = await sb.storage.from(BUCKET).createSignedUrls(nombres, FIRMA_SEG);
  (b.data || []).forEach(function(x){
    var m = /^s(\d+)\.jpg$/.exec(x.path || ''); if (m && x.signedUrl) SPR[+m[1]] = x.signedUrl;
  });
  await cargarEdiciones();
  arrancar(j2);
}

$('#velo').onclick = cerrar;
document.addEventListener('keydown', function(e){
  if ($('#ficha').hidden || EDITANDO) return;
  if (e.key === 'Escape') cerrar();
  if (e.key === 'ArrowRight') mover(1);
  if (e.key === 'ArrowLeft') mover(-1);
});
['#f-mejores','#f-descartes','#f-sinia','#f-soloia','#f-sinper'].forEach(function(s){
  $(s).onclick = function(e){
    var b = e.currentTarget, nuevo = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', nuevo ? 'true' : 'false');
    if (nuevo && s === '#f-sinia') $('#f-soloia').setAttribute('aria-pressed','false');
    if (nuevo && s === '#f-soloia') $('#f-sinia').setAttribute('aria-pressed','false');
    filtrar();
  };
});
$('#f-sel').onclick = function(){ modoSel(!MODO_SEL); };
$('#sel-fin').onclick = function(){ modoSel(false); };
$('#sel-todas').onclick = function(){ while (mostrados < vista.length) pintar(); vista.forEach(function(d){ SEL[d.id] = 1; }); document.querySelectorAll('.item').forEach(function(e){ e.classList.add('marcada'); }); contarSel(); };
$('#barra').querySelectorAll('button[data-acc]').forEach(function(b){ b.onclick = function(){ accionSel(b.dataset.acc); }; });
$('#sel-prod').onchange = function(){ var v = this.value; this.value = ''; if (v) accionSel('producto', v); };
$('#f-papelera').onclick = abrirPapelera;
var tq; $('#q').addEventListener('input', function(){ clearTimeout(tq); tq = setTimeout(filtrar, 150); });
$('#mas').onclick = function(){ pintar(); };
$('#salir').onclick = async function(){ await sb.auth.signOut(); location.replace(AQUI); };
var tr; addEventListener('resize', function(){ clearTimeout(tr); tr = setTimeout(ajustar, 150); });
cargar().catch(function(){
  bloquear('No se pudo cargar la Fototeca', 'Revisa la conexión y recarga la página.');
});
</script>
