<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tu cuenta empresa · Casa Zaru</title>
<!-- Vista previa del link en WhatsApp: textos fijos, nunca datos de la empresa
     (la página es la misma para todos; lo de cada cuenta lo trae el token). -->
<meta name="description" content="Revisa cuánto llevas comprado y el descuento que tienes en tus próximas compras.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Casa Zaru">
<meta property="og:title" content="Tu cuenta empresa · Casa Zaru">
<meta property="og:description" content="Revisa cuánto llevas comprado y el descuento que tienes en tus próximas compras.">
<meta property="og:image" content="https://cotizador.casazaru.cl/fotos/logo-casa-zaru-og-200.png">
<meta property="og:image:width" content="200">
<meta property="og:image:height" content="200">
<link rel="icon" href="fotos/logo-casa-zaru-og-200.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#485B3D;--terra:#B5652E;--dorado:#D4AC74;--dorado-cl:#EBD9BC;--crema:#F1ECE4;--crema2:#E8E1D5;--blanco:#fff;--tinta:#1F1D24;--tinta2:#5D5750;--tinta3:#8E877E;--borde:rgba(72,91,61,.14);--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--crema);color:var(--tinta);font-family:Poppins,-apple-system,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
h1{font-family:'Playfair Display',Georgia,serif}
.top{background:var(--verde);padding:16px 20px}
.top .in{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.top img{width:120px;display:block}
.top .t{color:var(--crema);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.75}
/* 24-10: la misma barra del panel de Empresas — escala fija $0 → $1,5M (2 %) → $3M (5 %), color según el tramo */
.rut{font-size:11.5px;color:var(--tinta3);margin:3px 0 18px}
.hero{background:var(--blanco);border-radius:16px;border:1px solid var(--borde);padding:18px 16px 16px}
.hero .l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta3)}
.hero .fila{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:2px;flex-wrap:wrap}
.hero .m{font-family:'Playfair Display',serif;font-size:30px;font-weight:700}
.dsc{font-weight:700;font-size:13px;border-radius:8px;padding:4px 9px;white-space:nowrap;background:var(--crema2);color:var(--tinta2)}
.dsc.t2{background:var(--dorado);color:var(--tinta)}.dsc.t5{background:var(--verde);color:#fff}
.bar2{position:relative;height:14px;background:var(--crema);border-radius:8px;margin:16px 0 6px}
.bar2 i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:#C9B8A3;transition:width .8s ease}
.bar2 i.t2{background:var(--dorado)}.bar2 i.t5{background:var(--verde)}
.bar2 .mk{position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#fff;box-shadow:0 0 0 1px var(--crema2)}
.bar2 .over{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:#fff;white-space:nowrap}
.esc{position:relative;height:30px;font-size:10.5px;color:var(--tinta3)}
.esc span{position:absolute;top:0;line-height:1.3}.esc b{display:block;color:var(--tinta);font-weight:600}
.falta{margin-top:10px;background:#F7EFE3;border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.falta b{color:var(--terra)}.falta.ok b{color:var(--verde)}
.cbar{height:5px;background:var(--crema2);border-radius:3px;margin:7px 0 3px;position:relative}.cbar i{position:absolute;left:0;top:0;bottom:0;background:var(--tinta2);border-radius:3px}
.lista{background:var(--blanco);border-radius:12px;border:1px solid var(--borde)}
.it{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--borde);font-size:12.5px}
.it:last-child{border-bottom:0}.it small{display:block;color:var(--tinta3);font-size:10.5px}.it b{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.bar2 i{transition:none}}
.wrap{max-width:520px;margin:0 auto;padding:18px 20px 32px}
h1{font-size:24px;margin:0 0 2px;color:var(--verde);font-weight:700;overflow-wrap:anywhere}
.sub{font-size:12px;color:var(--tinta2);margin-bottom:14px}
.big{background:var(--blanco);border-radius:14px;padding:16px;border:1px solid var(--borde);text-align:center;margin-bottom:12px}
.big .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tinta3)}
.big .v{font-size:30px;font-weight:700;color:var(--verde);margin:4px 0;font-family:'Playfair Display',serif}
.big .d{font-size:12.5px;color:var(--tinta2)}
.bar{height:10px;background:var(--crema2);border-radius:5px;margin:8px 0 4px;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--dorado),var(--terra));border-radius:5px;transition:width .6s}
.bar b{position:absolute;top:-2px;width:2px;height:14px;background:var(--verde);left:50%}
.leg{display:flex;justify-content:space-between;font-size:11px;color:var(--tinta3);gap:8px}
.tramos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
.tramo{border-radius:10px;padding:10px;border:1px solid var(--borde);background:var(--blanco);font-size:12px}
.tramo.on{background:var(--verde);color:var(--crema);border-color:var(--verde)}
.tramo .p{font-size:20px;font-weight:700;font-family:'Playfair Display',serif}
.ciclo{font-size:12px;color:var(--tinta2);margin-bottom:12px}
.lbl{font-size:11px;color:var(--tinta3);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
td{padding:7px 4px;border-top:1px solid var(--borde);vertical-align:top}
td.r{text-align:right;font-weight:600;white-space:nowrap}
.src{font-size:10px;color:var(--tinta3)}
.cta{display:block;text-align:center;background:var(--verde);color:#fff;font-weight:600;padding:12px;border-radius:var(--r);margin:8px 0;text-decoration:none}
.cta.sec{background:var(--blanco);color:var(--verde);border:1px solid var(--verde)}
.foot{font-size:11px;color:var(--tinta3);text-align:center;margin-top:16px;line-height:1.5}
.cond{font-size:11.5px;color:var(--tinta2);background:var(--blanco);border:1px solid var(--borde);border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.5}
.estado{text-align:center;padding:40px 20px;color:var(--tinta2)}
.estado h1{font-size:20px}
</style>
</head>
<body>
<div class="top"><div class="in"><img src="fotos/logo-casa-zaru-blanco.svg" alt="Casa Zaru"><div class="t">Cuenta empresa</div></div></div>
<div class="wrap" id="app"><div class="estado">Cargando tu cuenta…</div></div>
<script>
/* Lee UNA cuenta por su token (b2b_estado, proyecto de Gestión). La llave
   pública solo puede ejecutar esa función: no lista ni lee nada más. */
var SB_URL='https://padnttpgzuotxeipjrry.supabase.co';
var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBhZG50dHBnenVvdHhlaXBqcnJ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE4Nzg3MDMsImV4cCI6MjA5NzQ1NDcwM30.AKtkpG1W-J6sB_QNtyYdh3n_85U1TvTxtKyPjwJwDEs';
var WA='56956375558';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function clp(n){n=Math.round(Number(n)||0);return (n<0?'-':'')+'$'+Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function fecha(d,larga){if(!d)return '';var x=new Date(String(d).slice(0,10)+'T12:00:00');return x.toLocaleDateString('es-CL',larga?{day:'numeric',month:'long',year:'numeric'}:{day:'2-digit',month:'short',year:'2-digit'});}
function rutFmt(r){r=String(r||'');var c=r.split('-');if(c.length!==2)return r;return c[0].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+'-'+c[1];}
function estado(msg,sub){document.getElementById('app').innerHTML='<div class="estado"><h1>'+esc(msg)+'</h1><div>'+esc(sub||'')+'</div><a class="cta sec" style="margin-top:18px" href="https://wa.me/'+WA+'">Escribirnos por WhatsApp</a></div>';}
function render(c){
  var t=Number(c.tramo_pct)||0,acum=Number(c.acumulado)||0;
  var compras=(c.compras||[]);
  var nombre=(c.contacto||'').trim();
  var over=acum>3000000?'<span class="over">'+(acum/3000000).toLocaleString('es-CL',{maximumFractionDigits:1})+'× la meta</span>':'';
  var msgFalta=t===5?'<div class="falta ok">Tienes el <b>5 %</b>, el descuento más alto, en todas tus próximas compras.</div>':
    '<div class="falta">Te faltan <b>'+clp(t===2?c.falta_5:c.falta_2)+'</b> para pasar al <b>'+(t===2?'5':'2')+' %</b> en tus próximas compras.</div>';
  // ventana móvil (26-10): cada compra cuenta durante 12 meses y después sale sola
  var salida=c.salida_fecha?'El '+esc(fecha(c.salida_fecha,true))+' dejan de contar '+clp(c.salida_monto)+', que cumplen un año.':'';
  var html='<h1>'+esc(c.razon_social)+'</h1>'+
    '<div class="rut">RUT '+esc(rutFmt(c.rut))+(nombre?' · a cargo de '+esc(nombre):'')+'</div>'+
    '<div class="hero"><div class="l">Comprado en los últimos 12 meses</div>'+
      '<div class="fila"><div class="m">'+clp(acum)+'</div><div class="dsc t'+t+'">'+(t?t+' % de descuento':'aún sin descuento')+'</div></div>'+
      '<div class="bar2"><i class="t'+t+'" style="width:0" data-w="'+(acum/3000000*100>100?100:(acum/3000000*100).toFixed(1))+'"></i><div class="mk"></div>'+over+'</div>'+
      '<div class="esc"><span style="left:0">$0</span><span style="left:50%;transform:translateX(-50%);text-align:center"><b>2 %</b>$1,5M</span><span style="right:0;text-align:right"><b>5 %</b>$3M</span></div>'+
      msgFalta+'</div>'+
    '<div class="lbl" style="margin-top:20px">Cómo se cuenta</div>'+
    '<div class="ciclo" style="margin:0">Cada compra suma durante 12 meses y después deja de contar sola. '+salida+'</div>'+
    '<div class="lbl" style="margin-top:20px">Tus beneficios</div>'+
    '<div class="lista">'+
      '<div class="it"><div><b style="white-space:normal">Muestrario sin costo</b><small>Para las cuentas empresa; normalmente vale $20.000.</small></div></div>'+
      '<div class="it"><div><b style="white-space:normal">Descuento por lo que acumulas</b><small>2 % sobre $1.500.000 y 5 % sobre $3.000.000, además del 5 % por transferencia.</small></div></div>'+
      '<div class="it"><div><b style="white-space:normal">Cotizador para tus presupuestos</b><small>Valores por medida y especie, con el acabado incluido.</small></div></div>'+
      '<div class="it"><div><b style="white-space:normal">Despacho a todo Chile</b><small>Con convenios de transporte; el costo se ve por proyecto.</small></div></div>'+
    '</div>'+
    '<div class="lbl" style="margin-top:20px">Compras de los últimos 12 meses</div>'+
    (compras.length?'<div class="lista">'+compras.map(function(k){
      return '<div class="it"><div>'+esc(k.detalle||(k.tipo==='NC'?'Nota de crédito':'Compra'))+'<small>'+esc(fecha(k.fecha))+(k.folio?' · '+(k.tipo==='NC'?'Nota de crédito':'Factura')+' '+esc(k.folio):'')+'</small></div><b>'+clp(k.monto)+'</b></div>';
    }).join('')+'</div>':'<div class="ciclo">Todavía no hay compras en los últimos 12 meses.</div>')+
    '<a class="cta" style="margin-top:18px" href="./?utm_source=cuenta&utm_medium=link&utm_campaign=cuenta-empresa">Cotizar un proyecto</a>'+
    '<a class="cta sec" href="https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, escribo por la cuenta empresa de '+c.razon_social)+'">Escribirnos por WhatsApp</a>'+
    '<div class="cond">El descuento se aplica sobre el valor de lista del cotizador en las compras que hagas después de alcanzar cada tramo, y se suma al 5 % por pago con transferencia. Las cifras son los totales de tus facturas, IVA incluido.</div>'+
    '<div class="foot">Este enlace es privado, solo lo tienes tú.<br>Casa Zaru · Villarrica · casazaru.cl</div>';
  document.getElementById('app').innerHTML=html;
  // la barra se llena al abrir
  requestAnimationFrame(function(){requestAnimationFrame(function(){var b=document.querySelector('.bar2 i');if(b)b.style.width=b.getAttribute('data-w')+'%';});});
}
(async function(){
  var t=new URLSearchParams(location.search).get('t')||'';
  if(!/^[0-9a-f]{16,64}$/.test(t)){estado('Este enlace no es válido','Pídenos el link de tu cuenta por WhatsApp.');return;}
  try{
    var r=await fetch(SB_URL+'/rest/v1/rpc/b2b_estado',{method:'POST',headers:{'Content-Type':'application/json','apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON},body:JSON.stringify({p_token:t})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    var c=await r.json();
    if(!c){estado('No encontramos esta cuenta','Puede que el enlace esté incompleto o la cuenta se haya cerrado.');return;}
    document.title=c.razon_social+' · Casa Zaru';
    render(c);
  }catch(e){estado('No pudimos cargar tu cuenta','Intenta de nuevo en un momento. Si sigue igual, escríbenos.');}
})();
</script>
</body>
</html>
